name: build

on:
  push:
    branches:
      - master
      - development
    tags:
      - "*-[0-9]+.*"
  pull_request:
    branches:
      - master
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Start SeaweedFS S3 server
        run: |
          mkdir -p /tmp/seaweedfs && chmod 777 /tmp/seaweedfs
          docker run -d -p 9000:9000 --name seaweedfs \
            -v /tmp/seaweedfs:/data \
            -e "AWS_ACCESS_KEY_ID=n5test" \
            -e "AWS_SECRET_ACCESS_KEY=n5testsecret" \
            chrislusf/seaweedfs:4.48 mini -dir=/data -s3.port=9000 -master.telemetry=false
          # wait until it's ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/status && exit 0
            sleep 1
          done
          echo "SeaweedFS did not become ready"; docker logs seaweedfs; exit 1
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: 'maven'
      - name: Set up CI environment
        run: .github/setup.sh
      - name: Execute the build
        run: .github/build.sh
        env:
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
          OSSRH_PASS: ${{ secrets.OSSRH_PASS }}
          SIGNING_ASC: ${{ secrets.SIGNING_ASC }}
          AWS_REGION: us-east-1